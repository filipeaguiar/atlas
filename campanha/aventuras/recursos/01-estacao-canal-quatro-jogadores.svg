<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Estação Canal Quatro — mapa para os jogadores</title>
  <desc id="desc">Simulação de cheia com zona de triagem, passarela móvel, ilha de serviço, quiosque inclinado, táxi aquático e comporta.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ba5c5"/><stop offset=".5" stop-color="#2f7fa4"/><stop offset="1" stop-color="#66b2cc"/></linearGradient>
    <pattern id="waves" width="70" height="34" patternUnits="userSpaceOnUse"><path d="M0 17 Q18 2 35 17 T70 17" fill="none" stroke="#bde8f3" stroke-width="5" opacity=".42"/></pattern>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#bcc9ce" stroke-width="2"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d9f4fa"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#eef2ed"/>
  <rect x="35" y="35" width="1530" height="930" rx="22" fill="none" stroke="#174f73" stroke-width="8"/>
  <text x="80" y="95" font-family="sans-serif" font-size="38" font-weight="700" fill="#174f73">ESTAÇÃO CANAL QUATRO</text>
  <text x="80" y="137" font-family="sans-serif" font-size="21" fill="#52606d">SIMULAÇÃO CONTROLADA DE CHEIA — GINÁSIO MODULAR</text>

  <!-- margens e canal -->
  <path d="M55 180H420V930H55Z" fill="url(#grid)" stroke="#9ca9a0" stroke-width="5"/>
  <path d="M1180 180H1545V930H1180Z" fill="url(#grid)" stroke="#9ca9a0" stroke-width="5"/>
  <rect x="420" y="180" width="760" height="750" fill="url(#water)"/>
  <rect x="420" y="180" width="760" height="750" fill="url(#waves)"/>
  <path d="M470 280H1100M470 465H1100M470 650H1100M470 835H1100" stroke="#d9f4fa" stroke-width="8" opacity=".6" marker-end="url(#arrow)"/>

  <!-- triagem -->
  <rect x="105" y="405" width="245" height="240" rx="20" fill="#9ed58e" stroke="#347346" stroke-width="8" filter="url(#shadow)"/>
  <path d="M227 445v160M147 525h160" stroke="#fff" stroke-width="26"/>
  <text x="228" y="685" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#245c37">ZONA DE TRIAGEM</text>

  <!-- ilha central -->
  <path d="M690 370L920 350L965 655L655 670Z" fill="#d9d0b8" stroke="#766d58" stroke-width="8" filter="url(#shadow)"/>
  <rect x="735" y="440" width="145" height="120" rx="10" fill="#71818a" stroke="#39474e" stroke-width="6"/>
  <circle cx="807" cy="500" r="28" fill="#74d5ea" stroke="#174f73" stroke-width="6"/>
  <text x="810" y="715" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#3c4548">ILHA DE SERVIÇO</text>

  <!-- passarela móvel desalinhada -->
  <g transform="rotate(-17 505 525)" filter="url(#shadow)">
    <rect x="320" y="475" width="400" height="100" rx="15" fill="#e6b83e" stroke="#725816" stroke-width="8"/>
    <path d="M370 485v80M440 485v80M510 485v80M580 485v80M650 485v80" stroke="#fff1b5" stroke-width="8"/>
  </g>
  <circle cx="390" cy="525" r="34" fill="#42545e" stroke="#dce5e8" stroke-width="8"/>
  <text x="495" y="420" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#725816">PASSARELA MÓVEL</text>

  <!-- quiosque norte -->
  <g transform="rotate(-8 1015 275)" filter="url(#shadow)">
    <rect x="880" y="225" width="270" height="145" fill="#cf7656" stroke="#6f3829" stroke-width="8"/>
    <path d="M850 235L1015 155L1180 235Z" fill="#f0b45d" stroke="#6f3829" stroke-width="8"/>
    <rect x="925" y="275" width="75" height="95" fill="#94c6d3" stroke="#5a6670" stroke-width="5"/>
  </g>
  <!-- boneco norte -->
  <g transform="rotate(-8 1035 180)">
    <circle cx="1035" cy="165" r="22" fill="#f2d1ad" stroke="#26343a" stroke-width="5"/>
    <path d="M1035 187v70M995 215h80M1035 257l-45 55M1035 257l55 45" stroke="#26343a" stroke-width="18" stroke-linecap="round"/>
    <circle cx="1095" cy="203" r="12" fill="#e84855"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="1015" y="405" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#6f3829">QUIOSQUE INCLINADO</text>

  <!-- comporta -->
  <rect x="1125" y="425" width="75" height="330" fill="#53656e" stroke="#29363b" stroke-width="8"/>
  <path d="M1140 445h45M1140 490h45M1140 535h45M1140 580h45M1140 625h45M1140 670h45M1140 715h45" stroke="#aab9bf" stroke-width="10"/>
  <rect x="1215" y="520" width="95" height="115" rx="10" fill="#29424d" stroke="#86cfe3" stroke-width="6"/>
  <circle cx="1262" cy="557" r="15" fill="#e84855"/>
  <circle cx="1262" cy="600" r="15" fill="#e6b83e"/>
  <text x="1330" y="685" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#39474e">COMPORTA</text>

  <!-- táxi sul -->
  <g transform="rotate(7 990 785)" filter="url(#shadow)">
    <path d="M835 745Q990 690 1135 745L1095 855Q990 895 870 845Z" fill="#f1c94e" stroke="#624d12" stroke-width="8"/>
    <rect x="920" y="745" width="125" height="70" rx="25" fill="#bce2eb" stroke="#456977" stroke-width="6"/>
    <path d="M1130 755L1180 705" stroke="#ece5ca" stroke-width="9"/>
  </g>
  <!-- boneco sul -->
  <g transform="rotate(7 980 790)">
    <circle cx="980" cy="760" r="20" fill="#f2d1ad" stroke="#26343a" stroke-width="5"/>
    <path d="M980 782v62M945 805h70M980 842l-35 38M980 842l42 32" stroke="#26343a" stroke-width="17" stroke-linecap="round"/>
    <circle cx="1040" cy="790" r="12" fill="#e84855"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="970" y="930" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#624d12">TÁXI AQUÁTICO</text>

  <!-- legenda visual -->
  <rect x="1185" y="205" width="325" height="150" rx="14" fill="#fff" opacity=".92" stroke="#174f73" stroke-width="4"/>
  <circle cx="1225" cy="250" r="12" fill="#e84855"/>
  <text x="1250" y="258" font-family="sans-serif" font-size="21" fill="#26343a">Pulseira de resgate</text>
  <path d="M1210 300h55" stroke="#d9f4fa" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="1280" y="307" font-family="sans-serif" font-size="21" fill="#26343a">Sentido da corrente</text>
</svg>
