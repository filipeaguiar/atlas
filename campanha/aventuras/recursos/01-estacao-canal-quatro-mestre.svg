<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Estação Canal Quatro — mapa anotado do Mestre</title>
  <desc id="desc">Mapa tático com os quatro marcadores de progresso, sentido da corrente, obstáculos e sequência final.</desc>
  <defs>
    <pattern id="waves" width="72" height="34" patternUnits="userSpaceOnUse"><path d="M0 17Q18 2 36 17T72 17" fill="none" stroke="#bde8f3" stroke-width="5" opacity=".48"/></pattern>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d9f4fa"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d59a24"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f5f6f2"/>
  <rect x="35" y="35" width="1530" height="930" rx="22" fill="none" stroke="#174f73" stroke-width="8"/>
  <text x="75" y="92" font-family="sans-serif" font-size="36" font-weight="700" fill="#174f73">ESTAÇÃO CANAL QUATRO — MAPA DO MESTRE</text>
  <text x="75" y="132" font-family="sans-serif" font-size="20" fill="#52606d">Preencha os marcadores 1–4 antes da terceira falha</text>

  <!-- terreno -->
  <rect x="70" y="180" width="340" height="720" fill="#d8d9cc" stroke="#7d8379" stroke-width="6"/>
  <rect x="410" y="180" width="770" height="720" fill="#2f7fa4"/>
  <rect x="410" y="180" width="770" height="720" fill="url(#waves)"/>
  <rect x="1180" y="180" width="350" height="720" fill="#d8d9cc" stroke="#7d8379" stroke-width="6"/>
  <path d="M470 300H1080M470 490H1080M470 680H1080M470 845H1080" stroke="#d9f4fa" stroke-width="9" marker-end="url(#arrowBlue)"/>
  <text x="725" y="225" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">CORRENTE CONTROLADA →</text>

  <!-- áreas -->
  <rect x="105" y="410" width="245" height="205" rx="18" fill="#9ed58e" stroke="#347346" stroke-width="8" filter="url(#shadow)"/>
  <path d="M228 445v130M163 510h130" stroke="#fff" stroke-width="25"/>
  <text x="228" y="655" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#245c37">TRIAGEM</text>

  <path d="M680 360L925 345L970 665L645 680Z" fill="#d9d0b8" stroke="#766d58" stroke-width="8" filter="url(#shadow)"/>
  <text x="805" y="535" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#4c4637">ILHA DE<br/>SERVIÇO</text>

  <g transform="rotate(-17 510 515)" filter="url(#shadow)"><rect x="315" y="467" width="420" height="96" rx="14" fill="#e6b83e" stroke="#725816" stroke-width="8"/><path d="M370 475v80M445 475v80M520 475v80M595 475v80M670 475v80" stroke="#fff1b5" stroke-width="8"/></g>
  <circle cx="390" cy="515" r="34" fill="#42545e" stroke="#dce5e8" stroke-width="8"/>

  <g transform="rotate(-8 1030 285)" filter="url(#shadow)"><rect x="890" y="240" width="270" height="145" fill="#cf7656" stroke="#6f3829" stroke-width="8"/><path d="M860 250L1025 165L1190 250Z" fill="#f0b45d" stroke="#6f3829" stroke-width="8"/></g>
  <circle cx="1035" cy="188" r="25" fill="#e84855" stroke="#fff" stroke-width="7"/>
  <text x="1010" y="420" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#6f3829">BONECO NORTE</text>

  <g transform="rotate(7 990 795)" filter="url(#shadow)"><path d="M840 750Q990 700 1140 750L1100 860Q990 900 870 850Z" fill="#f1c94e" stroke="#624d12" stroke-width="8"/><rect x="925" y="755" width="125" height="68" rx="25" fill="#bce2eb" stroke="#456977" stroke-width="6"/></g>
  <circle cx="1000" cy="790" r="25" fill="#e84855" stroke="#fff" stroke-width="7"/>
  <text x="970" y="925" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#624d12">BONECO SUL — TÁXI</text>

  <rect x="1128" y="430" width="72" height="310" fill="#53656e" stroke="#29363b" stroke-width="8"/>
  <path d="M1141 452h45M1141 500h45M1141 548h45M1141 596h45M1141 644h45M1141 692h45" stroke="#aab9bf" stroke-width="10"/>
  <rect x="1220" y="515" width="110" height="125" rx="10" fill="#29424d" stroke="#86cfe3" stroke-width="6"/>
  <text x="1335" y="685" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#39474e">COMPORTA</text>

  <!-- marcadores -->
  <g font-family="sans-serif" font-weight="700">
    <circle cx="535" cy="385" r="45" fill="#174f73" stroke="#fff" stroke-width="7"/><text x="535" y="400" text-anchor="middle" font-size="42" fill="#fff">1</text>
    <circle cx="1090" cy="230" r="45" fill="#174f73" stroke="#fff" stroke-width="7"/><text x="1090" y="245" text-anchor="middle" font-size="42" fill="#fff">2</text>
    <circle cx="1115" cy="825" r="45" fill="#174f73" stroke="#fff" stroke-width="7"/><text x="1115" y="840" text-anchor="middle" font-size="42" fill="#fff">3</text>
    <circle cx="1280" cy="455" r="45" fill="#d59a24" stroke="#fff" stroke-width="7"/><text x="1280" y="470" text-anchor="middle" font-size="42" fill="#fff">4</text>
  </g>

  <!-- rota de evacuação -->
  <path d="M1035 260C900 300 820 350 800 430M1000 790C900 750 825 690 800 610M780 560C620 570 500 565 330 535" fill="none" stroke="#d59a24" stroke-width="13" stroke-dasharray="20 13" marker-end="url(#arrowGold)"/>

  <!-- legenda -->
  <rect x="1210" y="205" width="290" height="195" rx="16" fill="#fff" stroke="#174f73" stroke-width="5"/>
  <text x="1240" y="245" font-family="sans-serif" font-size="22" font-weight="700" fill="#174f73">MARCADORES</text>
  <text x="1240" y="282" font-family="sans-serif" font-size="20" fill="#26343a">1  Rota segura</text>
  <text x="1240" y="315" font-family="sans-serif" font-size="20" fill="#26343a">2  Resgate norte</text>
  <text x="1240" y="348" font-family="sans-serif" font-size="20" fill="#26343a">3  Resgate sul</text>
  <text x="1240" y="381" font-family="sans-serif" font-size="20" fill="#26343a">4  Fechar comporta</text>
</svg>
