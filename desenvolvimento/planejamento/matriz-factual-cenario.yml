metadata:
  titulo: Matriz factual para reconstrução dos fundamentos do cenário
  status: ativo
  publicar: false
  finalidade: autorizar afirmações da reescrita sem transformar planejamento interno em fonte narrativa

fontes_permitidas:
  - id: introducao-canonica
    caminho: publicacao/fontes/introducao/01-introducao.md
    autoridade: fatos e orientações explicitamente presentes no texto aprovado
  - id: regras-indice
    caminho: regras/README.md
    autoridade: escopo e princípios mecânicos gerais
  - id: regras-operacoes
    caminho: regras/05-operacoes-do-atlas.md
    autoridade: Chamados, Graus, licenças, supervisão, resgates, investigação, consequências e debriefing
  - id: governanca
    caminho: AGENTS.md
    autoridade: restrições de cânone, agência, tom e publicação; não cria fatos ficcionais
  - id: questoes-abertas
    caminho: apendices/questoes-em-aberto.md
    autoridade: limites negativos; não cria respostas

fontes_proibidas_como_autoridade_narrativa:
