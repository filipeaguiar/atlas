name: Publicar site Hugo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obter repositório
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Instalar Python
        run: uv python install 3.12

      - name: Instalar Hugo Extended fixado
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg --install /tmp/hugo.deb
          hugo version

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Executar testes
        run: uv run pytest

      - name: Gerar site estrito
        run: uv run python tools/generate_site.py --base-url "${{ steps.pages.outputs.base_url }}/"

      - name: Verificar ausência de PDFs
        run: test -z "$(find build/site -type f -iname '*.pdf' -print -quit)"

      - name: Enviar somente o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
